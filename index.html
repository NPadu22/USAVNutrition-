/* ===== Content from Google Sheet (standalone site) =====
   CONFIG.sheetId = the long ID in the Google Sheet's address. Sheet sharing: "Anyone with the link can view".
   The app shows the last good copy instantly, then refreshes from the sheet. */
function parseCSV(t){const rows=[];let row=[],f="",q=false;for(let i=0;i<t.length;i++){const c=t[i];
  if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
  else if(c==='"')q=true;else if(c===","){row.push(f);f=""}else if(c==="\n"||c==="\r"){if(c==="\r"&&t[i+1]==="\n")i++;row.push(f);rows.push(row);row=[];f=""}else f+=c}
  if(f!==""||row.length){row.push(f);rows.push(row)}
  const head=(rows.shift()||[]).map(h=>h.trim());return rows.filter(r=>r.some(v=>v.trim())).map(r=>Object.fromEntries(head.map((h,i)=>[h,(r[i]||"").trim()])))}
function toISO(v){v=String(v||"").trim();let m=v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return `${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`;
  m=v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);if(m){const y=m[3].length===2?"20"+m[3]:m[3];return `${y}-${m[1].padStart(2,"0")}-${m[2].padStart(2,"0")}`}
  const d=new Date(v);return isNaN(d)?"":isoOf(d)}
function parseAl(v){return [...new Set(String(v||"").split(/[,;]/).map(x=>x.trim().toLowerCase()).filter(Boolean)
  .map(x=>ALLERGENS.find(A=>A.toLowerCase()===x||A.toLowerCase().split("/").includes(x)||A.toLowerCase().startsWith(x)||((x==="gluten"||x==="wheat")&&A==="Wheat/Gluten"))).filter(Boolean))]}
const yesv=v=>/^(y|yes|true|x|✓)$/i.test(String(v||"").trim());
const dayv=v=>DAYS.find(d=>String(v||"").trim().toLowerCase().startsWith(d.toLowerCase()));
function weeks(rows,make){const W=[];rows.forEach(r=>{const w=parseInt(r.Week,10),d=dayv(r.Day);if(!w||!d)return;while(W.length<w)W.push({});(W[w-1][d]=W[w-1][d]||[]).push(make(r))});return W}
function numv(v){const n=parseFloat(String(v||"").replace(/[^\d.]/g,""));return isNaN(n)?null:n}
/* Read one sheet tab. JSONP (a script tag) avoids browser cross-site limits; CSV fetch is the backup. */
function gvizTab(t){return new Promise((res,rej)=>{
  const cb="__gv"+Math.random().toString(36).slice(2),sc=document.createElement("script");
  const done=()=>{clearTimeout(tm);try{delete window[cb]}catch(e){window[cb]=undefined}sc.remove()};
  const tm=setTimeout(()=>{done();rej(new Error("timeout "+t))},15000);
  window[cb]=d=>{done();if(!d||d.status==="error"||!d.table)return rej(new Error(t));
    const cols=d.table.cols.map(c=>String(c.label||"").trim());
    res(d.table.rows.map(r=>Object.fromEntries(cols.map((h,i)=>{const c=(r.c||[])[i];return [h,c==null?"":String(c.f!=null?c.f:(c.v==null?"":c.v)).trim()]})))
      .filter(o=>Object.values(o).some(v=>v)))};
  sc.onerror=()=>{done();rej(new Error(t))};
  sc.src=`https://docs.google.com/spreadsheets/d/${CONFIG.sheetId}/gviz/tq?tqx=out:json;responseHandler:${cb}&headers=1&sheet=${encodeURIComponent(t)}&_=${Date.now()}`;
  document.head.appendChild(sc)})}
async function csvTab(t){const r=await fetch(`https://docs.google.com/spreadsheets/d/${CONFIG.sheetId}/gviz/tq?tqx=out:csv&headers=1&sheet=${encodeURIComponent(t)}&_=${Date.now()}`,{cache:"no-store"});if(!r.ok)throw new Error(t);return parseCSV(await r.text())}
async function loadSheet(){
  if(!CONFIG.sheetId)return;
  const tabs=["Settings","Announcements","Breakfast","Lunch","Stations","Smoothies","Recipes","Snacks"];
  const T={};
  try{await Promise.all([...tabs.map(async t=>{T[t]=await gvizTab(t).catch(()=>csvTab(t))}),(async()=>{T.Matches=await gvizTab("Matches").catch(()=>csvTab("Matches")).catch(()=>[])})()])}catch(e){console.warn("Sheet not loaded",e);return}
  const set=Object.fromEntries(T.Settings.map(r=>[r.Setting,r.Value]));
  const recipes={},notes={};
  T.Recipes.forEach(r=>{if(!r.Flavor)return;const x={ing:r.Ingredients.split(/\n|;/).map(s=>s.trim()).filter(Boolean),y:r.Makes||"",a:parseAl(r.Allergens),est:yesv(r.Estimated)};
    const k=numv(r.Calories);if(k!=null){x.kcal=k;x.cho=numv(r["Carbs g"]);x.pro=numv(r["Protein g"]);x.fat=numv(r["Fat g"])}
    const aw=parseAl(r["Allergens on whey days (if different)"]);if(aw.length)x.aw=aw;recipes[r.Flavor]=x;if(r.Note)notes[r.Flavor]=r.Note});
  const rec=n=>recipes[n]||{a:[]};
  const NEW={updated:toISO(set["Last updated"])||DATA.updated,start:toISO(set["Rotation start"])||DATA.start,
    wheyProtein:set["Whey protein"]||DATA.wheyProtein,plantProtein:set["Plant protein"]||DATA.plantProtein,
    announcements:T.Announcements.filter(r=>r.Headline).map(r=>({when:toISO(r.Date),tag:r.Tag,t:r.Headline,d:r.Details})).sort((a,b)=>(b.when||"").localeCompare(a.when||"")),
    cycles:{Breakfast:weeks(T.Breakfast,r=>({t:"",n:r["Main dish"],d:r.Details,a:parseAl(r.Allergens),ok:yesv(r.Confirmed)})),
            Lunch:weeks(T.Lunch,r=>({t:r.Theme,n:r["Main dish"],d:r.Details,a:parseAl(r.Allergens),ok:yesv(r.Confirmed)})),Dinner:[]},
    stations:T.Stations.filter(r=>r.Station).map(r=>({t:"",n:r.Station,d:r.Details,a:parseAl(r.Allergens),ok:yesv(r.Confirmed)})),
    smoothieCycle:weeks(T.Smoothies,r=>({team:/^m/i.test(r.Team)?"Men":/^w/i.test(r.Team)?"Women":"Both",whey:r["Whey flavor"],plant:r["Plant flavor"],
      aw:rec(r["Whey flavor"]).aw||rec(r["Whey flavor"]).a,ap:rec(r["Plant flavor"]).a,ok:yesv(r.Confirmed)})),
    smoothieRecipes:recipes,flavorNotes:notes,
    chapter:set["Season chapter"]||"",
    voteOptions:String(set["Smoothie vote options"]||"").split(",").map(x=>x.trim()).filter(Boolean),
    fans:T.Recipes.filter(r=>r.Flavor&&yesv(r["Fan favorite"])).map(r=>r.Flavor),
    matches:(T.Matches||[]).filter(r=>r.Date).map(r=>({date:toISO(r.Date),time:r["Start time"]||"",opp:r.Opponent||"",team:/^m/i.test(r.Team||"")?"MNT":/^w/i.test(r.Team||"")?"WNT":"Both",loc:r.Location||""})),
    snackCycle:weeks(T.Snacks,r=>({t:r.Category,n:r.Snack,d:"",a:parseAl(r.Allergens),ok:yesv(r.Confirmed)}))};
  DATA=Object.assign({},DATA,NEW);
  try{localStorage.setItem("af_sheet",JSON.stringify(DATA))}catch(e){}
  if(document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))return;
  render();
}
try{const c=JSON.parse(localStorage.getItem("af_sheet")||"null");if(c&&CONFIG.sheetId)DATA=Object.assign({},DATA,c)}catch(e){}
loadSheet();
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")loadSheet()});
